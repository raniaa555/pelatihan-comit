<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Layout Semantic</title>
    <style> 
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgb(255, 214, 222);
            text-align: center;
            font-size: 20px;
        }
        nav { 
            margin-bottom: 20px;            
            display: flex;
            justify-content: center;
            gap: 15px;
        }    
        main {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin: 20px;
            align-items: flex-start;
        }
        aside {
            flex: 1;
            background-color: rgb(255, 180, 195);
            padding: 20px;
            border-radius: 8px;
            min-height: 200px;
        }
        section {
            flex: 3;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .row-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .p1 {
            background-color: rgb(255, 132, 216);
            padding: 10px;
            margin: 0;
        }
        .p2 {
            background-color: rgb(255, 200, 242);
            padding: 10px;
            margin: 0;
        }
        .p3 {
            background-color: rgb(255, 132, 216);
            padding: 10px;
            margin: 0;
        }
        figure {
            margin: 20px;
        }
        footer {
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="https://www.instagram.com/">Instagram</a>
            <a href="https://x.com/home">x.com</a>
            <a href="https://discord.com/channels/@me">Discord</a>
        </nav>
    </header>
    <main>
        <aside>
            <p>Day 1 Belajar Semantik HTML with COMIT</p>
        </aside>
        <section>
            <article>
                <figure>
                    <img src="https://i.pinimg.com/736x/42/0b/35/420b358b0535fc7ab1a20799a6cfac7a.jpg" width="400">
                </figure>
                <div>
                    <p class="p1">Lorem ipsum dolor sit amet</p>
                    <p class="p2">Lorem ipsum dolor sit amet</p>
                    <p class="p3">Lorem ipsum dolor sit amet</p>
                </div>    
            </article>
        </section>  

    </main>        
        
    <footer>
        copyright @2026
    </footer>
</body>
</html>
